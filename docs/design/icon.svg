<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="512" height="512" shape-rendering="crispEdges">
  <!-- Ícone do app: chapéu fez em pixel art (arte original) -->
  <rect width="16" height="16" rx="3.5" fill="#1E1B3A"/>
  <!-- estrelinhas -->
  <rect x="2" y="2" width="1" height="1" fill="#F5B700" opacity=".55"/>
  <rect x="13" y="12" width="1" height="1" fill="#F5B700" opacity=".55"/>
  <rect x="2" y="12" width="1" height="1" fill="#4FC3C9" opacity=".5"/>
  <!-- topo -->
  <rect x="6" y="3" width="5" height="1" fill="#A3172B"/>
  <!-- corpo -->
  <rect x="5" y="4" width="6" height="1" fill="#D7263D"/>
  <rect x="5" y="5" width="7" height="2" fill="#D7263D"/>
  <rect x="4" y="7" width="8" height="1" fill="#D7263D"/>
  <!-- faixa -->
  <rect x="4" y="8" width="9" height="1" fill="#A3172B"/>
  <rect x="3" y="9" width="10" height="2" fill="#A3172B"/>
  <!-- brilho lateral -->
  <rect x="5" y="4" width="1" height="3" fill="#F0566A"/>
  <rect x="4" y="7" width="1" height="1" fill="#F0566A"/>
  <!-- cordão -->
  <rect x="11" y="3" width="1" height="1" fill="#F5B700"/>
  <rect x="12" y="4" width="1" height="1" fill="#F5B700"/>
  <rect x="13" y="5" width="1" height="3" fill="#F5B700"/>
  <!-- borla -->
  <rect x="12" y="8" width="3" height="2" fill="#F5B700"/>
  <rect x="12" y="10" width="1" height="1" fill="#F5B700"/>
  <rect x="14" y="10" width="1" height="1" fill="#F5B700"/>
  <!-- sombra no chão -->
  <rect x="4" y="12" width="8" height="1" fill="#000" opacity=".35"/>
</svg>
