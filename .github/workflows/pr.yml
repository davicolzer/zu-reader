name: PR

# Em cada PR (para a staging ou a main): só confere o código, com testes e lint. O APK é gerado
# depois do merge: na staging, a versão de teste (fluxo Staging); na main, a release (fluxo Release).
on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: 1 · Testes e lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar ambiente
        uses: ./.github/actions/preparar

      - name: Testes do leitor Zu (alfabeto e classificador)
        run: ./gradlew :core:zu:test --warning-mode all

      - name: Testes de visão (imagens, fotos reais, câmera, recorte, histórico)
        run: ./gradlew :core:vision:test --warning-mode all

      - name: Testes do app (anotações)
        run: ./gradlew :app:testDebugUnitTest --warning-mode all

      - name: Lint do app
        run: ./gradlew :app:lintDebug --warning-mode all

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
