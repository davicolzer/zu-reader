name: PR

# Em cada PR: confere o código (testes e lint). Nos PRs para a staging, só isso: o APK é gerado no
# merge (fluxo Staging). Nos PRs para a main, também gera os APKs (ficam nos artefatos da execução).
on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: 1 · Testes e lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar ambiente
        uses: ./.github/actions/preparar

      - name: Testes do leitor Zu (alfabeto e classificador)
        run: ./gradlew :core:zu:test --warning-mode all

      - name: Testes de visão (imagens, fotos reais, câmera, recorte, histórico)
        run: ./gradlew :core:vision:test --warning-mode all

      - name: Testes do app (anotações)
        run: ./gradlew :app:testDebugUnitTest --warning-mode all

      - name: Lint do app
        run: ./gradlew :app:lintDebug --warning-mode all

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  apk:
    name: 2 · Build dos APKs
    needs: testes
    if: github.base_ref != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código (com histórico, para o número da build)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar ambiente
        uses: ./.github/actions/preparar

      # sem a chave de publicação: o APK de teste do PR é assinado com a chave do projeto,
      # e código que ainda não entrou na main nunca tem acesso à chave
      - name: Gerar APKs
        uses: ./.github/actions/gerar-apks
