name: Release

# Depois do merge na main (ou à mão em Actions → Release → Run workflow): gera os APKs e publica
# uma release, marcada como a mais recente (Latest), com o APK para instalar. Os testes já rodaram no PR.
on:
  push:
    branches: [main]
    paths-ignore: # só documentação: não gera versão (mesma lista do pr.yml)
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/pull_request_template.md"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    name: 1 · Build dos APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.apks.outputs.version }}
      signed: ${{ steps.apks.outputs.signed }}
    steps:
      - name: Baixar o código (com histórico, para o número da build)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar ambiente
        uses: ./.github/actions/preparar

      - name: Gerar APKs
        id: apks
        uses: ./.github/actions/gerar-apks
        with:
          keystore-base64: ${{ secrets.ZU_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ZU_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ZU_KEY_ALIAS }}
          key-password: ${{ secrets.ZU_KEY_PASSWORD }}

  release:
    name: 2 · Publicar release
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Baixar os APKs do job anterior
        uses: actions/download-artifact@v8
        with:
          name: zu-reader
          path: dist

      - name: Conferir a assinatura de produção
        # sem a chave de publicação (secrets ZU_*), o APK sairia com a chave de teste, que é pública:
        # a release não é publicada (ver docs/RELEASE.md)
        if: needs.apk.outputs.signed != 'true'
        run: |
          echo "::error::Chave de publicação não configurada: crie os secrets ZU_KEYSTORE_BASE64, ZU_KEYSTORE_PASSWORD, ZU_KEY_ALIAS e ZU_KEY_PASSWORD (docs/RELEASE.md)"
          exit 1

      - name: Deixar só o que o usuário precisa
        # o APK de teste e o AAB (Play Store) ficam nos artefatos da execução, não na release
        run: |
          rm -f dist/*-debug.apk dist/*-sem-assinatura.apk dist/*.aab
          # cópia com nome fixo: o link .../releases/latest/download/zu-reader.apk do README
          # sempre baixa a versão mais nova
          cp dist/zu-reader-*.apk dist/zu-reader.apk
          ls -la dist

      - name: Escrever notas da release
        env:
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          {
            echo "## Install / Instalar"
            echo
            echo "1. On your phone, download **zu-reader.apk** below. / No celular, baixe **zu-reader.apk** abaixo."
            echo "2. Open it and allow installs from this source if Android asks. / Abra e, se o Android pedir, permita instalar dessa fonte."
            echo "3. It installs over the previous version and keeps your collection. / Instala por cima da versão anterior e mantém a coleção."
            echo
            echo "\`zu-reader-${VERSION}.apk\` is the same file with the version in the name. / é o mesmo arquivo, com a versão no nome."
            echo
          } > notas.md
          cat notas.md

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          publicar() {
            gh release create "v${VERSION}" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Zu Reader ${VERSION}" \
              --notes-file notas.md \
              --generate-notes \
              --latest
          }
          # falha passageira do GitHub (ex.: no envio dos arquivos): apaga o que ficou pela metade
          # (release e tag) e tenta de novo, até 3 vezes
          for tentativa in 1 2 3; do
            publicar && exit 0
            echo "::warning::Falhou ao publicar (tentativa ${tentativa}); limpando e tentando de novo"
            gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
            sleep $((tentativa * 15))
          done
          exit 1
