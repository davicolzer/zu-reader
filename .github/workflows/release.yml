name: Release

# Depois do merge na main: gera os APKs e publica uma pré-release com o APK para instalar.
# À mão (Actions → Release → Run workflow), com "estável" marcado: publica uma versão estável,
# que vira a "Latest" da página de releases. Os testes já rodaram no PR.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      estavel:
        description: "Versão estável (Latest), não pré-release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    name: 1 · Build dos APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.apks.outputs.version }}
      signed: ${{ steps.apks.outputs.signed }}
    steps:
      - name: Baixar o código (com histórico, para o número da build)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar ambiente
        uses: ./.github/actions/preparar

      - name: Gerar APKs
        id: apks
        uses: ./.github/actions/gerar-apks
        with:
          keystore-base64: ${{ secrets.ZU_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ZU_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ZU_KEY_ALIAS }}
          key-password: ${{ secrets.ZU_KEY_PASSWORD }}

  release:
    name: 2 · Publicar release
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Baixar os APKs do job anterior
        uses: actions/download-artifact@v8
        with:
          name: zu-reader
          path: dist

      - name: Deixar só o que o usuário precisa
        # o APK de depuração e o sem assinatura ficam nos artefatos da execução, não na release
        run: |
          rm -f dist/*-debug.apk dist/*-sem-assinatura.apk
          ls -la dist

      - name: Escrever notas da release
        env:
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          {
            echo "## Install / Instalar"
            echo
            echo "1. On your phone, download **zu-reader-${VERSION}.apk** below. / No celular, baixe **zu-reader-${VERSION}.apk** abaixo."
            echo "2. Open it and allow installs from this source if Android asks. / Abra e, se o Android pedir, permita instalar dessa fonte."
            echo "3. It installs over the previous version and keeps your collection. / Instala por cima da versão anterior e mantém a coleção."
            echo
            echo "\`zu-reader-${VERSION}.aab\`: Play Store bundle / pacote para a Play Store."
            echo
          } > notas.md
          cat notas.md

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.apk.outputs.version }}
          STABLE: ${{ inputs.estavel == true }}
        run: |
          if [ "$STABLE" = "true" ]; then
            # mudanças desde a última versão estável; ela vira a "Latest"
            START=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
            KIND=(--latest ${START:+--notes-start-tag "$START"})
          else
            KIND=(--prerelease)
          fi
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Zu Reader ${VERSION}" \
            --notes-file notas.md \
            --generate-notes \
            "${KIND[@]}"
