name: Android CI

# Em PRs: testes, lint e build dos APKs.
# Na main (e quando rodada à mão em qualquer branch): também publica uma release
# com o APK para instalar no celular.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Só cancela execuções antigas de PR; na main cada build vira uma release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  testes:
    name: 1 · Testes e lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar JDK 25 (LTS)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Preparar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Instalar Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Testes do leitor Zu (alfabeto e classificador)
        run: ./gradlew :core:zu:test --warning-mode all

      - name: Testes de visão (imagem, câmera, recorte, histórico)
        run: ./gradlew :core:vision:test --warning-mode all

      - name: Lint do app
        run: ./gradlew :app:lintDebug --warning-mode all

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  apk:
    name: 2 · Build dos APKs
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.nomes.outputs.version }}
      signed: ${{ steps.nomes.outputs.signed }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar JDK 25 (LTS)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Preparar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Instalar Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      # Opcional: com os secrets configurados, o release sai assinado (ver docs/RELEASE.md).
      - name: Preparar chave de release (se configurada)
        env:
          ZU_KEYSTORE_BASE64: ${{ secrets.ZU_KEYSTORE_BASE64 }}
        if: env.ZU_KEYSTORE_BASE64 != ''
        run: |
          echo "$ZU_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zu-release.jks"
          echo "ZU_KEYSTORE_PATH=$RUNNER_TEMP/zu-release.jks" >> "$GITHUB_ENV"

      - name: Gerar APK de teste (debug)
        run: ./gradlew :app:assembleDebug --warning-mode all

      - name: Gerar APK e AAB de release
        env:
          ZU_KEYSTORE_PASSWORD: ${{ secrets.ZU_KEYSTORE_PASSWORD }}
          ZU_KEY_ALIAS: ${{ secrets.ZU_KEY_ALIAS }}
          ZU_KEY_PASSWORD: ${{ secrets.ZU_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --warning-mode all

      - name: Dar nome aos arquivos
        id: nomes
        run: |
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)-build.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/zu-reader-${VERSION}-teste.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/zu-reader-${VERSION}.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/zu-reader-${VERSION}-sem-assinatura.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          cp app/build/outputs/bundle/release/app-release.aab "dist/zu-reader-${VERSION}.aab"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Guardar APKs
        uses: actions/upload-artifact@v7
        with:
          name: zu-reader
          path: dist/

  release:
    name: 3 · Publicar release
    needs: apk
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Baixar os APKs do job anterior
        uses: actions/download-artifact@v8
        with:
          name: zu-reader
          path: dist

      - name: Escrever notas da release
        env:
          VERSION: ${{ needs.apk.outputs.version }}
          SIGNED: ${{ needs.apk.outputs.signed }}
        run: |
          {
            echo "Build automático do Zu Reader a partir de \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7})."
            echo
            echo "## Instalar no celular"
            echo
            echo "1. No celular, abra esta página e baixe **zu-reader-${VERSION}-teste.apk**."
            echo "2. Abra o arquivo baixado. Se o Android pedir, permita instalar apps dessa fonte."
            echo "3. Versões novas instalam por cima da anterior; o histórico é mantido."
            echo
            echo "## Arquivos"
            echo
            echo "- \`zu-reader-${VERSION}-teste.apk\`: para testar (assinado com a chave de teste do projeto)."
            if [ "$SIGNED" = "true" ]; then
              echo "- \`zu-reader-${VERSION}.apk\`: release assinado com a chave de publicação."
            else
              echo "- \`zu-reader-${VERSION}-sem-assinatura.apk\`: release sem assinatura (não instala; ver docs/RELEASE.md)."
            fi
            echo "- \`zu-reader-${VERSION}.aab\`: pacote para a Play Store."
          } > notas.md
          cat notas.md

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Zu Reader ${VERSION}" \
            --notes-file notas.md \
            --prerelease
