name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, testes, lint e release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: JDK 25 (LTS)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      # Opcional: com os secrets configurados, o release sai assinado (ver docs/RELEASE.md).
      - name: Keystore de release
        env:
          ZU_KEYSTORE_BASE64: ${{ secrets.ZU_KEYSTORE_BASE64 }}
        if: env.ZU_KEYSTORE_BASE64 != ''
        run: |
          echo "$ZU_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zu-release.jks"
          echo "ZU_KEYSTORE_PATH=$RUNNER_TEMP/zu-release.jks" >> "$GITHUB_ENV"

      - name: Build (compila, testes, lint, APK e AAB de release)
        env:
          ZU_KEYSTORE_PASSWORD: ${{ secrets.ZU_KEYSTORE_PASSWORD }}
          ZU_KEY_ALIAS: ${{ secrets.ZU_KEY_ALIAS }}
          ZU_KEY_PASSWORD: ${{ secrets.ZU_KEY_PASSWORD }}
        run: ./gradlew build bundleRelease --warning-mode all

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - name: APK de debug
        uses: actions/upload-artifact@v7
        with:
          name: zu-reader-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Release (APK e AAB)
        uses: actions/upload-artifact@v7
        with:
          name: zu-reader-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
